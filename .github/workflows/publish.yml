name: Check and publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to check and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3
      - run: nix flake show --all-systems
      - run: nix flake check -L
      - name: Check native assembly and fetching
        run: |
          nix shell --inputs-from . .#drvjs nixpkgs#nodejs nixpkgs#pnpm_10 nixpkgs#python3 nixpkgs#gitMinimal --command bash -euc '
            for test in integration configured unpacked native native-compat native-store-patches native-already-applied; do
              bash "tests/$test.sh"
            done
            python3 tests/registry.py
            DRVJS_BIN=$(command -v drvjs) node tests/fetch.mjs
            python3 tests/ci.py
          '

  flakehub:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3
      - uses: DeterminateSystems/flakehub-push@dceefcb33cba27bde28f8540d8b4537cb925c46b
        with:
          name: ryantm/drvjs
          tag: ${{ inputs.tag || github.ref_name }}
          visibility: public
          spdx-expression: CC0-1.0

  flakestry:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: flakestry/flakestry-publish@08cfeb3dc22bf4e2df64ba84e8dae19918e44e0b
        with:
          version: ${{ inputs.tag || github.ref_name }}
          ref: ${{ inputs.tag || github.sha }}
